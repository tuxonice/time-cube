<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Time Cube</title>
    
    <style>
body {
  margin: 0;
  font-family: Roboto, Arial, sans-serif;
  line-height: 1.5;
  color: #616264;
  background: #e5e5e5;
}
input[type=text],
input[type=number],
input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}
input[type=submit] {
  width: 100%;
  background: #4caf50;
  color: #fff;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1.2rem;
}
input[type=submit]:hover {
  background: #45a049;
}
.container {
  max-width: 960px;
  padding: 0 15px;
  margin: 0 auto;
}
.section-header {
  text-align: center;
  padding: 1.5rem 0;
}
h2 {
  font-size: 1.5rem;
  margin: 0 0 1rem;
  font-weight: 500;
}
hr {
  margin: 1rem 0;
  border: 0;
  border-top: 1px solid rgba(0,0,0,0.1);
}
.alert {
  padding: 20px;
  color: #fff;
  margin-bottom: 15px;
  border-radius: 4px;
  background: #999;
}
.alert.danger {
  background: #f44336;
}
.alert.success {
  background: #4caf50;
}
.closebtn {
  margin-left: 15px;
  color: #fff;
  font-weight: 700;
  float: right;
  font-size: 22px;
  line-height: 20px;
  cursor: pointer;
  transition: 0.3s;
}
.closebtn:hover {
  color: #000;
}
footer {
  color: #6c757d;
  text-align: center;
  padding-top: 1rem;
  margin: 1.5rem 0 1rem;
}
    </style>
  </head>
  <body>
      <div class="container">
          <div class="section-header">
            <h1>Time Cube Configuration</h1>
          </div>
        
          <div class="alert danger">
            <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
            This is an alert box.
          </div>
          <div class="alert success">
            <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
            This is an alert box.
          </div>

      <form action="/" method="POST">
      <h2>Wifi</h2>
       
      <label>Network</label>
      <input type="text"name="wifi-network" value="" required />

      <label>Password</label>
      <input type="password" name="wifi-password" value="" required />

      <hr/>
      <h2>Configuration</h2>
      
      <label>Settle Time (ms)</label>
        <input type="number" name="settle-time" value="" required />
        
      <input type="submit" value="Save">
    </form>
    <footer>
        <p>&copy; 2026 TLab</p>
      </footer>
    </div>
  </body>
</html>
